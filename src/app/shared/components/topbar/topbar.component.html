<header class="topbar">
  <!-- Title -->
  <div class="tb-title">
    <h1>{{ pageTitle }}</h1>
    <p *ngIf="pageSubtitle">{{ pageSubtitle }}</p>
  </div>

  <!-- Search -->
  <div class="tb-search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" placeholder="Rechercher..." [(ngModel)]="searchQuery" />
  </div>

  <!-- Actions -->
  <div class="tb-actions">
    <!-- Notifications -->
    <div class="tb-dropdown">
      <button class="tb-icon-btn" (click)="toggleNotif()" aria-label="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="tb-dot" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </button>

      <div class="tb-panel notif-panel" *ngIf="notifOpen">
        <div class="tb-panel-head">
          <span>Notifications</span>
          <button (click)="markAllRead()">Tout marquer comme lu</button>
        </div>
        <div class="notif-list">
          <div class="notif-item" *ngFor="let n of notifications" [class.unread]="!n.read">
            <div class="notif-ic" [class.read]="n.read">
              <svg *ngIf="n.icon === 'bell'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <svg *ngIf="n.icon === 'check'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              <svg *ngIf="n.icon === 'info'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            </div>
            <div class="notif-body">
              <div class="notif-title">{{ n.title }}</div>
              <div class="notif-msg">{{ n.message }}</div>
              <div class="notif-date">{{ n.date }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- User menu -->
    <div class="tb-dropdown">
      <button class="tb-user" (click)="toggleMenu()">
        <div class="tb-avatar">{{ (displayName || '?')[0] }}</div>
        <div class="tb-user-meta">
          <span class="tb-user-name">{{ displayName }}</span>
          <span class="tb-user-role">{{ auth.role === 'ADMIN' ? 'Administrateur' : 'Client' }}</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>

      <div class="tb-panel menu-panel" *ngIf="menuOpen">
        <a [routerLink]="auth.role === 'ADMIN' ? '/admin/configuration' : '/client/profil'" class="menu-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Mon profil
        </a>
        <button class="menu-item danger" (click)="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Déconnexion
        </button>
      </div>
    </div>
  </div>
</header>
