<header class="topbar">
  <!-- Title -->
  <div class="tb-title">
    <h1>{{ pageTitle }}</h1>
    <p *ngIf="pageSubtitle">{{ pageSubtitle }}</p>
  </div>

  <!-- Search -->
  <div class="tb-search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" placeholder="Rechercher..." [(ngModel)]="searchQuery" />
  </div>

  <!-- Actions -->
  <div class="tb-actions">
    <!-- Notifications -->
    <div class="tb-dropdown">
      <button class="tb-icon-btn" (click)="toggleNotif()" aria-label="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="tb-dot" *ngIf="unreadCount > 0">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
      </button>

      <div class="tb-panel notif-panel" *ngIf="notifOpen">
        <div class="tb-panel-head">
          <span>Notifications</span>
          <button (click)="markAllRead()" [disabled]="unreadCount === 0">Tout marquer comme lu</button>
        </div>

        <div class="notif-list" *ngIf="latestNotifications.length; else empty">
          <div class="notif-item"
               *ngFor="let n of latestNotifications"
               [class.unread]="!n.is_read"
               (click)="onNotifClick(n, $event)">
            <div class="notif-ic" [class.read]="n.is_read" [attr.data-kind]="iconKind(n.type)">
              <!-- Revenue -->
              <svg *ngIf="iconKind(n.type) === 'revenue'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
              </svg>
              <!-- Dépense -->
              <svg *ngIf="iconKind(n.type) === 'depense'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>
              </svg>
              <!-- Objectif -->
              <svg *ngIf="iconKind(n.type) === 'objectif'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
              </svg>
              <!-- Réclamation -->
              <svg *ngIf="iconKind(n.type) === 'reclamation'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
              <!-- Post forum -->
              <svg *ngIf="iconKind(n.type) === 'post'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 2H7a2 2 0 0 0-2 2v16l4-4h8a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
              </svg>
              <!-- Default bell -->
              <svg *ngIf="iconKind(n.type) === 'bell'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
            </div>
            <div class="notif-body">
              <div class="notif-msg">{{ n.message }}</div>
              <div class="notif-date">{{ relativeTime(n.timestamp) }}</div>
            </div>
            <div class="notif-actions">
              <button class="notif-del" (click)="deleteNotif(n, $event)" aria-label="Supprimer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <ng-template #empty>
          <div class="notif-empty">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span>Aucune notification</span>
          </div>
        </ng-template>

        <div class="notif-foot" *ngIf="latestNotifications.length">
          <button (click)="viewAll()">Voir toutes les notifications</button>
        </div>
      </div>
    </div>

    <!-- User menu -->
    <div class="tb-dropdown">
      <button class="tb-user" (click)="toggleMenu()">
        <div class="tb-avatar">{{ (displayName || '?')[0] }}</div>
        <div class="tb-user-meta">
          <span class="tb-user-name">{{ displayName }}</span>
          <span class="tb-user-role">{{ auth.role === 'ADMIN' ? 'Administrateur' : 'Client' }}</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>

      <div class="tb-panel menu-panel" *ngIf="menuOpen">
        <a [routerLink]="auth.role === 'ADMIN' ? '/admin/configuration' : '/client/profil'" class="menu-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Mon profil
        </a>
        <button class="menu-item danger" (click)="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Déconnexion
        </button>
      </div>
    </div>
  </div>
</header>

<!-- Toast notification temps réel -->
<div class="notif-toast" *ngIf="toastNotif" [@.disabled]="false">
  <div class="toast-ic" [attr.data-kind]="iconKind(toastNotif.type)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
  </div>
  <div class="toast-body">
    <div class="toast-title">Nouvelle notification</div>
    <div class="toast-msg">{{ toastNotif.message }}</div>
  </div>
  <button class="toast-close" (click)="closeToast()" aria-label="Fermer">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
</div>
