<div class="cd-overlay" *ngIf="open" (click)="onCancel()">
  <div class="cd-box" (click)="$event.stopPropagation()">
    <div class="cd-icon" [class.danger]="danger">
      <svg *ngIf="danger" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <svg *ngIf="!danger" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
    </div>
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>
    <div class="cd-actions">
      <button class="cd-btn cancel" (click)="onCancel()">{{ cancelLabel }}</button>
      <button class="cd-btn" [class.danger]="danger" [class.primary]="!danger" (click)="onConfirm()">{{ confirmLabel }}</button>
    </div>
  </div>
</div>
