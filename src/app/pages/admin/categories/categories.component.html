<div class="page">
  <!-- Tabs -->
  <div class="cat-tabs">
    <button class="cat-tab" [class.active]="tab === 'revenue'" (click)="setTab('revenue')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      Revenues
    </button>
    <button class="cat-tab" [class.active]="tab === 'objectif'" (click)="setTab('objectif')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
      Objectifs
    </button>
  </div>

  <!-- Toolbar -->
  <div class="page-toolbar">
    <span class="tab-info">{{ list.length }} catégorie(s) de type {{ tabLabel }}</span>
    <div class="toolbar-spacer"></div>
    <button class="btn btn-primary-g" (click)="openAdd()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Nouvelle catégorie
    </button>
  </div>

  <div class="state-box" *ngIf="loading">Chargement...</div>
  <div class="state-box error" *ngIf="errorMsg && !loading">{{ errorMsg }}</div>

  <!-- Grid -->
  <div class="cat-grid" *ngIf="!loading && !errorMsg && list.length">
    <div class="cat-card" *ngFor="let c of list">
      <div class="cat-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
      </div>
      <div class="cat-body">
        <h4>{{ c.nom }}</h4>
        <p>{{ c.description || 'Aucune description' }}</p>
      </div>
      <div class="cat-actions">
        <button class="icon-btn edit" (click)="openEdit(c)" aria-label="Modifier">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
        </button>
        <button class="icon-btn del" (click)="askDelete(c)" aria-label="Supprimer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="table-card" *ngIf="!loading && !errorMsg && !list.length">
    <app-empty-state
      title="Aucune catégorie"
      message="Ajoutez des catégories pour aider les clients à classer leurs opérations."
      actionLabel="Ajouter une catégorie"
      (action)="openAdd()">
    </app-empty-state>
  </div>
</div>

<!-- Modal add/edit -->
<app-modal
  [open]="modalOpen"
  [title]="editingId != null ? 'Modifier la catégorie' : 'Nouvelle catégorie'"
  [subtitle]="'Catégorie de type ' + tabLabel"
  (closed)="modalOpen = false">

  <div class="form-grid">
    <div class="form-group full">
      <label class="form-label">Nom de la catégorie</label>
      <input class="form-input" type="text" [(ngModel)]="formNom" placeholder="Ex : Salaire" />
    </div>
    <div class="form-group full">
      <label class="form-label">Description</label>
      <input class="form-input" type="text" [(ngModel)]="formDescription" placeholder="Brève description (optionnel)" />
    </div>
    <div class="form-group full" *ngIf="formError">
      <span class="form-error">{{ formError }}</span>
    </div>
  </div>

  <div modal-footer>
    <button class="btn btn-ghost" (click)="modalOpen = false">Annuler</button>
    <button class="btn btn-primary-g" (click)="save()" [disabled]="saving">
      {{ saving ? 'Enregistrement...' : (editingId != null ? 'Enregistrer' : 'Ajouter') }}
    </button>
  </div>
</app-modal>

<!-- Confirm delete -->
<app-confirm-dialog
  [open]="confirmOpen"
  title="Supprimer cette catégorie ?"
  [message]="'« ' + (toDelete?.nom || '') + ' » sera définitivement supprimée.'"
  confirmLabel="Supprimer"
  (confirmed)="confirmDelete()"
  (cancelled)="confirmOpen = false">
</app-confirm-dialog>

<!-- Toast -->
<div class="mm-toast" [ngClass]="toastType" *ngIf="toast">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  {{ toast }}
</div>
