<div class="page">

  <!-- KPI -->
  <div class="kpi-grid">
    <app-stat-card label="Total"       [value]="countAll.toString()"     icon="bell"    color="primary"></app-stat-card>
    <app-stat-card label="Non lues"    [value]="countUnread.toString()"  icon="bell"    color="danger"></app-stat-card>
    <app-stat-card label="Lues"        [value]="countRead.toString()"    icon="check"   color="success"></app-stat-card>
  </div>

  <!-- Toolbar -->
  <div class="page-toolbar">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" placeholder="Rechercher dans les notifications..." [(ngModel)]="search" />
    </div>

    <select class="select-box" [(ngModel)]="filterStatut">
      <option value="">Toutes</option>
      <option value="unread">Non lues</option>
      <option value="read">Lues</option>
    </select>

    <select class="select-box" [(ngModel)]="filterType">
      <option value="">Tous types</option>
      <option value="revenue">Revenu</option>
      <option value="depense">Dépense</option>
      <option value="objectif">Objectif</option>
      <option value="reclamation">Réclamation</option>
      <option value="post">Forum</option>
    </select>

    <button class="btn btn-ghost btn-sm" (click)="resetFilters()" *ngIf="search || filterStatut || filterType">
      Réinitialiser
    </button>

    <div class="toolbar-spacer"></div>

    <button class="btn btn-primary-g" (click)="markAllRead()" [disabled]="!countUnread">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      Tout marquer comme lu
    </button>
  </div>

  <div class="state-box" *ngIf="loading">Chargement des notifications...</div>

  <!-- Liste -->
  <div class="notif-cards" *ngIf="!loading">

    <div class="notif-card" *ngFor="let n of list" [class.unread]="!n.is_read" (click)="toggleRead(n)">
      <div class="nc-ic" [attr.data-kind]="iconKind(n.type)">
        <svg *ngIf="iconKind(n.type) === 'revenue'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        <svg *ngIf="iconKind(n.type) === 'depense'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
        <svg *ngIf="iconKind(n.type) === 'objectif'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        <svg *ngIf="iconKind(n.type) === 'reclamation'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <svg *ngIf="iconKind(n.type) === 'post'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2H7a2 2 0 0 0-2 2v16l4-4h8a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg>
        <svg *ngIf="iconKind(n.type) === 'bell'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </div>

      <div class="nc-body">
        <div class="nc-head">
          <span class="nc-type">{{ typeLabel(n.type) }}</span>
          <span class="nc-dot" *ngIf="!n.is_read"></span>
          <span class="nc-date">{{ relativeTime(n.timestamp) }}</span>
        </div>
        <div class="nc-msg">{{ n.message }}</div>
      </div>

      <button class="nc-del" (click)="delete(n); $event.stopPropagation()" aria-label="Supprimer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>

    <app-empty-state
      *ngIf="!list.length"
      title="Aucune notification"
      message="Aucune notification ne correspond à votre recherche.">
    </app-empty-state>
  </div>
</div>

<!-- Toast -->
<div class="mm-toast" [ngClass]="toastType" *ngIf="toast">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
  {{ toast }}
</div>
