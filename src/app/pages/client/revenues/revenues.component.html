<div class="page">
  <!-- Toolbar -->
  <div class="page-toolbar">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" placeholder="Rechercher un revenue..." [(ngModel)]="search" />
    </div>

    <select class="select-box" [(ngModel)]="filterCat">
      <option [ngValue]="0">Toutes les catégories</option>
      <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.name }}</option>
    </select>

    <div class="toolbar-spacer"></div>

    <div class="total-pill">
      Total : <strong>{{ total | number:'1.2-2' }} €</strong>
    </div>

    <button class="btn btn-primary-g" (click)="openAdd()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Nouveau revenue
    </button>
  </div>

  <!-- États -->
  <div class="state-box" *ngIf="loading">Chargement des revenues...</div>
  <div class="state-box error" *ngIf="errorMsg && !loading">{{ errorMsg }}</div>

  <!-- Table -->
  <div class="table-card" *ngIf="!loading && !errorMsg">
    <table class="data-table" *ngIf="list.length; else empty">
      <thead>
        <tr>
          <th>Description</th>
          <th>Source</th>
          <th>Catégorie</th>
          <th>Date</th>
          <th>Montant</th>
          <th style="text-align:right">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of list">
          <td class="td-strong">{{ r.description }}</td>
          <td class="td-muted">{{ r.source || '—' }}</td>
          <td>
            <span class="cat-pill" [style.background]="catColor(r.categoryId) + '1f'" [style.color]="catColor(r.categoryId)">
              {{ catName(r.categoryId) }}
            </span>
          </td>
          <td class="td-muted">{{ r.date }}</td>
          <td><span class="amount-pos">+{{ r.amount | number:'1.2-2' }} €</span></td>
          <td>
            <div class="cell-actions">
              <button class="icon-btn edit" (click)="openEdit(r)" aria-label="Modifier">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
              </button>
              <button class="icon-btn del" (click)="askDelete(r)" aria-label="Supprimer">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <ng-template #empty>
      <div class="table-empty">
        <app-empty-state
          title="Aucun revenue"
          message="Commencez à suivre vos rentrées d'argent en ajoutant votre premier revenue."
          actionLabel="Ajouter un revenue"
          (action)="openAdd()">
        </app-empty-state>
      </div>
    </ng-template>
  </div>
</div>

<!-- Modal add/edit -->
<app-modal
  [open]="modalOpen"
  [title]="editing ? 'Modifier le revenue' : 'Nouveau revenue'"
  [subtitle]="editing ? 'Mettez à jour les informations' : 'Ajoutez une nouvelle rentrée d\'argent'"
  (closed)="modalOpen = false">

  <div class="form-grid">
    <div class="form-group full">
      <label class="form-label">Description</label>
      <input class="form-input" type="text" [(ngModel)]="form.description" placeholder="Ex : Salaire mai" />
    </div>
    <div class="form-group">
      <label class="form-label">Source</label>
      <input class="form-input" type="text" [(ngModel)]="form.source" placeholder="Ex : Employeur" />
    </div>
    <div class="form-group">
      <label class="form-label">Montant (€)</label>
      <input class="form-input" type="number" [(ngModel)]="form.amount" placeholder="0.00" />
    </div>
    <div class="form-group">
      <label class="form-label">Date</label>
      <input class="form-input" type="date" [(ngModel)]="form.date" />
    </div>
    <div class="form-group">
      <label class="form-label">Catégorie</label>
      <select class="form-select" [(ngModel)]="form.categoryId">
        <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.name }}</option>
      </select>
    </div>
    <div class="form-group full" *ngIf="formError">
      <span class="form-error">{{ formError }}</span>
    </div>
  </div>

  <div modal-footer>
    <button class="btn btn-ghost" (click)="modalOpen = false">Annuler</button>
    <button class="btn btn-primary-g" (click)="save()" [disabled]="saving">
      {{ saving ? 'Enregistrement...' : (editing ? 'Enregistrer' : 'Ajouter') }}
    </button>
  </div>
</app-modal>

<!-- Confirm delete -->
<app-confirm-dialog
  [open]="confirmOpen"
  title="Supprimer ce revenue ?"
  [message]="'« ' + (toDelete?.description || '') + ' » sera définitivement supprimé.'"
  confirmLabel="Supprimer"
  (confirmed)="confirmDelete()"
  (cancelled)="confirmOpen = false">
</app-confirm-dialog>

<!-- Toast -->
<div class="mm-toast" [ngClass]="toastType" *ngIf="toast">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  {{ toast }}
</div>
